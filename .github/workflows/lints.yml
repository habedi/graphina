name: Run Linter Checks

on:
  workflow_dispatch:
  schedule: # Run every night at midnight (UTC)
    - cron: '0 0 * * *'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'pygraphina/**'
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'pygraphina/**'
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Check formatting
        run: nix develop --command make format-check

      - name: Check module dependencies
        run: nix develop --command make check-module-deps

      - name: Check Local Publishing Command
        run: nix develop --command python scripts/test_publish.py

      - name: Run linters
        run: nix develop --command make lint

      - name: Check dependency advisories, licenses, and bans
        run: nix develop --command make deny
