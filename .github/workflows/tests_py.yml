name: Run Python Tests

on:
  workflow_dispatch:
  schedule: # Run every night at midnight (UTC)
    - cron: '0 0 * * *'
  pull_request:
    branches:
      - main
    paths:
      - 'pygraphina/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'flake.nix'
      - 'flake.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/tests_py.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'pygraphina/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'flake.nix'
      - 'flake.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/tests_py.yml'
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-py:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Run Python tests and generate coverage report
        run: |
          nix develop --command uv sync --locked --extra dev
          nix develop --command make test-py

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: pygraphina
        continue-on-error: true
