name: Publish Docs (Graphina and PyGraphina)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Install dependencies
        run: nix develop --command uv sync --locked --extra dev

      - name: Build Graphina docs
        run: nix develop --command uv run --locked mkdocs build

      - name: Build PyGraphina docs
        run: nix develop --command uv run --locked mkdocs build --config-file pygraphina/mkdocs.yml

      - name: Merge documentation sites
        run: |
             mkdir -p site/python
             cp -r pygraphina/site/* site/python/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
